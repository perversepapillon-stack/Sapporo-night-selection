<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAPPORO NIGHT SELECTION</title><style>html,body{margin:0;background:#05060d;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100dvh;display:block}</style></head><body><iframe id="app" src="/index.html" title="SAPPORO NIGHT SELECTION"></iframe><script>const frame=document.getElementById('app'),keys=['A','B','C'],ids={A:{radio:'ga',detail:'da'},B:{radio:'gb',detail:'db'},C:{radio:'gc',detail:'dc'}};async function loadConfig(){try{const r=await fetch('/site-config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return null}}function text(el,v){if(el&&v!=null)el.textContent=v}function setCard(doc,key,c){const radio=doc.getElementById(ids[key].radio),card=doc.querySelector(`label[for="${ids[key].radio}"]`),detail=doc.getElementById(ids[key].detail);if(card){card.style.display=c.enabled===false?'none':'';text(card.querySelector('.name'),c.name);text(card.querySelector('.role'),c.role);if(c.imageUrl)card.querySelector('img').src=c.imageUrl}if(radio&&c.enabled===false)radio.disabled=true;if(detail){if(c.imageUrl)detail.querySelector('.detailHero img').src=c.imageUrl;const title=detail.querySelector('.detailTitle');if(title)text(title.querySelector('b'),c.name);const stats=[...detail.querySelectorAll('.stat')],vals=[['雰囲気',c.atmosphere],['盛り上がり',c.excitement],['札幌らしさ',c.sapporo],['予算',c.budget]];vals.forEach((x,i)=>{if(stats[i]){text(stats[i].querySelector('small'),x[0]);const nodes=[...stats[i].childNodes].filter(n=>n.nodeType===3);if(nodes.length)nodes[nodes.length-1].nodeValue=x[1]||'';else stats[i].append(document.createTextNode(x[1]||''))}});const panel=detail.querySelector('.panel');if(panel)panel.textContent='「'+(c.quote||'')+'」'}}}function fixParticipant(doc){const s4=doc.getElementById('s4');if(!s4)return;const labels=[...s4.querySelectorAll('label.fld')],party=labels.find(x=>x.textContent.includes('二次会参加'));if(party){const toggle=party.nextElementSibling;party.remove();if(toggle&&toggle.classList.contains('toggle'))toggle.remove()}const receipt=labels.find(x=>x.textContent.trim()==='領収書');if(receipt){const old=receipt.nextElementSibling;if(old&&old.classList.contains('toggle'))old.remove();const wrap=doc.createElement('div');wrap.className='toggle';wrap.innerHTML='<button type="button" data-v="必要">必要</button><button type="button" data-v="不要">不要</button>';wrap.querySelectorAll('button').forEach(b=>{b.style.cssText='flex:1;text-align:center;border:1px solid #363b57;padding:12px;border-radius:12px;background:#111528;color:white;font:inherit';b.onclick=()=>{wrap.dataset.value=b.dataset.v;wrap.querySelectorAll('button').forEach(x=>x.style.outline='none');b.style.outline='2px solid #f1c35b';const nl=[...s4.querySelectorAll('label.fld')].find(x=>x.textContent.includes('領収書の宛名'));if(nl){nl.style.display=b.dataset.v==='不要'?'none':'';if(nl.nextElementSibling)nl.nextElementSibling.style.display=b.dataset.v==='不要'?'none':''}}});receipt.after(wrap);wrap.querySelector('button').click()}const s5=doc.getElementById('s5');if(s5){const p=s5.querySelector('.panel');if(p)p.innerHTML='所属単組　：入力内容<br>氏名　　　：入力内容<br>選択コース：SECRET<br>領収書　　：必要／不要<br><br><span style="color:#9ba0b7">※現在は確認画面の表示テスト中です</span>'}}frame.addEventListener('load',async()=>{const doc=frame.contentDocument;fixParticipant(doc);const cfg=await loadConfig();if(!cfg)return;if(cfg.site){text(doc.querySelector('.kicker'),cfg.site.kicker);const lead=doc.querySelector('.lead');if(lead&&cfg.site.lead)lead.innerHTML=cfg.site.lead.replace(/\n/g,'<br>')}keys.forEach(k=>setCard(doc,k,cfg.courses[k]||{}))});</script></body></html>
