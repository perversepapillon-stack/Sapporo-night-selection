<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAPPORO NIGHT SELECTION</title><style id="boot">html,body{margin:0;background:#05060d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#b8bdd0}</style></head><body><div class="loading">SAPPORO NIGHT SELECTION</div><script>
(async()=>{
  const source=await fetch('/index.html?rev='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('base page load failed');return r.text()});
  const parsed=new DOMParser().parseFromString(source,'text/html');
  document.getElementById('boot')?.remove();
  [...parsed.head.querySelectorAll('style')].forEach(s=>document.head.appendChild(s.cloneNode(true)));
  document.body.innerHTML=parsed.body.innerHTML;

  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  // 参加情報を実操作できる形へ作り直し
  const s4=$('#s4');
  if(s4){
    const labels=$$('label.fld',s4);
    const party=labels.find(x=>x.textContent.trim()==='二次会参加');
    if(party){const next=party.nextElementSibling;party.remove();if(next?.classList.contains('toggle'))next.remove()}

    const orgLabel=$$('label.fld',s4).find(x=>x.textContent.trim()==='所属単組');
    const nameLabel=$$('label.fld',s4).find(x=>x.textContent.trim()==='氏名');
    if(orgLabel?.nextElementSibling)orgLabel.nextElementSibling.id='organization';
    if(nameLabel?.nextElementSibling)nameLabel.nextElementSibling.id='memberName';

    const receiptLabel=$$('label.fld',s4).find(x=>x.textContent.trim()==='領収書');
    if(receiptLabel){
      const old=receiptLabel.nextElementSibling;
      if(old?.classList.contains('toggle'))old.remove();
      const wrap=document.createElement('div');wrap.className='toggle';wrap.id='receiptChoice';wrap.dataset.value='必要';
      wrap.innerHTML='<button type="button" data-v="必要">必要</button><button type="button" data-v="不要">不要</button>';
      wrap.querySelectorAll('button').forEach(b=>{
        b.style.cssText='display:block;flex:1;text-align:center;border:1px solid #363b57;padding:12px;border-radius:12px;background:#111528;color:#fff;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation';
        b.addEventListener('click',()=>{
          wrap.dataset.value=b.dataset.v;
          wrap.querySelectorAll('button').forEach(x=>{x.style.outline='none';x.style.background='#111528'});
          b.style.outline='2px solid #f1c35b';b.style.background='#302409';
          const rn=$$('label.fld',s4).find(x=>x.textContent.trim()==='領収書の宛名');
          if(rn){rn.style.display=b.dataset.v==='不要'?'none':'';if(rn.nextElementSibling){rn.nextElementSibling.style.display=b.dataset.v==='不要'?'none':'';rn.nextElementSibling.id='receiptName'}}
        });
      });
      receiptLabel.after(wrap);wrap.querySelector('[data-v="必要"]').click();
    }
  }

  function course(){return $('#ga')?.checked?'A':$('#gb')?.checked?'B':'C'}
  function data(){const required=$('#receiptChoice')?.dataset.value!=='不要';return{organization:$('#organization')?.value.trim()||'',name:$('#memberName')?.value.trim()||'',course:course(),receiptRequired:required,receiptName:required?($('#receiptName')?.value.trim()||''):''}}
  function confirmView(){const d=data(),p=$('#s5 .panel');if(p)p.innerHTML=`所属単組　：${esc(d.organization||'未入力')}<br>氏名　　　：${esc(d.name||'未入力')}<br>選択コース：${d.course}<br>領収書　　：${d.receiptRequired?'必要':'不要'}${d.receiptRequired?`<br>宛名　　　：${esc(d.receiptName||'未入力')}`:''}`}

  const confirmBtn=$('label[for="st5"]');
  confirmBtn?.addEventListener('click',confirmView);

  const submitBtn=$('label[for="st6"]');
  if(submitBtn){
    const replacement=document.createElement('button');replacement.type='button';replacement.className='btn gold';replacement.textContent='申込を確定する';replacement.style.width='100%';replacement.style.font='inherit';replacement.style.cursor='pointer';replacement.style.touchAction='manipulation';
    submitBtn.replaceWith(replacement);
    replacement.addEventListener('click',async()=>{
      const d=data();
      if(!d.organization||!d.name){alert('所属単組と氏名を入力してください');$('#st4').checked=true;return}
      if(d.receiptRequired&&!d.receiptName){alert('領収書が必要な場合は宛名を入力してください');$('#st4').checked=true;return}
      replacement.disabled=true;replacement.textContent='保存中…';
      try{
        const r=await fetch('/api/submissions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const j=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(j.error||'保存に失敗しました');
        $('#st6').checked=true;replacement.textContent='申込完了';
      }catch(e){replacement.disabled=false;replacement.textContent='申込を確定する';alert('申込を保存できませんでした　'+e.message)}
    });
  }

  // 設定ファイル反映
  try{
    const cfg=await fetch('/site-config.json?rev='+Date.now(),{cache:'no-store'}).then(r=>r.json());
    const ids={A:['ga','da'],B:['gb','db'],C:['gc','dc']};
    for(const key of ['A','B','C']){
      const c=cfg.courses?.[key];if(!c)continue;const [rid,did]=ids[key];const card=$(`label[for="${rid}"]`),detail=$('#'+did);
      if(card){card.style.display=c.enabled===false?'none':'';const n=$('.name',card),role=$('.role',card);if(n)n.textContent=c.name||'';if(role)role.textContent=c.role||'';if(c.imageUrl&&$('img',card))$('img',card).src=c.imageUrl}
      if(detail){if(c.imageUrl&&$('.detailHero img',detail))$('.detailHero img',detail).src=c.imageUrl;const b=$('.detailTitle b',detail);if(b)b.textContent=c.name||''}
    }
  }catch(e){}
})().catch(e=>{document.body.innerHTML='<div style="padding:30px;color:white;font-family:sans-serif">読み込みに失敗しました<br>'+String(e.message)+'</div>'});
</script></body></html>
