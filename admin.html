<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SNS 管理画面</title><style>:root{--bg:#080a12;--p:#111625;--line:#303750;--txt:#f7f4ef;--muted:#aab0c2;--gold:#f1c35b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070912,#0d1120);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{font-size:22px;margin:0}.badge{font-size:11px;color:var(--gold);border:1px solid #665629;border-radius:999px;padding:6px 9px}.panel{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{padding:11px;border:1px solid var(--line);border-radius:12px;background:#0d1120;color:white}.tab.on{outline:2px solid var(--gold)}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}input,textarea{width:100%;border:1px solid #38405d;background:#0a0e1b;color:white;border-radius:10px;padding:11px;font:inherit}textarea{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.switch{display:flex;align-items:center;gap:8px}.switch input{width:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}button,a.btn{border:1px solid #4c5577;border-radius:12px;padding:13px;background:#171d32;color:white;font-weight:700;text-decoration:none;text-align:center}.primary{background:linear-gradient(90deg,#664710,#362813)!important;border-color:#9a762f!important;color:#fff5d1!important}.notice{font-size:12px;line-height:1.7;color:var(--muted)}#status{min-height:22px;margin-top:10px;font-size:13px}.ok{color:#9ee6b0}.err{color:#ff9d9d}.secret{border-style:dashed}.small{font-size:11px;color:#8e95aa}</style></head><body><div class="wrap"><div class="head"><h1>SAPPORO NIGHT SELECTION<br>管理画面</h1><span class="badge">ADMIN</span></div><div class="panel"><b>公開画面の基本設定</b><label>上部コピー</label><input id="kicker"><label>説明</label><textarea id="lead"></textarea></div><div class="panel"><div class="tabs"><button class="tab on" data-k="A">A</button><button class="tab" data-k="B">B</button><button class="tab" data-k="C">C</button></div><div class="switch"><input type="checkbox" id="enabled"><label for="enabled" style="margin:12px 0">このコースを公開する</label></div><div class="row"><div><label>案内人名</label><input id="name"></div><div><label>肩書き</label><input id="role"></div></div><label>画像URL</label><input id="imageUrl" placeholder="https://..."><div class="row"><div><label>雰囲気</label><input id="atmosphere"></div><div><label>予算</label><input id="budget"></div></div><div class="row"><div><label>盛り上がり</label><input id="excitement"></div><div><label>札幌らしさ</label><input id="sapporo"></div></div><label>案内人の一言</label><textarea id="quote"></textarea></div><div class="panel secret"><b>公開反映</b><p class="notice">管理画面からGitHubの設定ファイルだけを書き換えます<br>GitHubのFine-grained tokenはこのページのセッション中だけ保持し、サイトには保存しません</p><label>GitHub token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><div class="actions"><a class="btn" href="/" target="_blank">公開画面を見る</a><button id="publish" class="primary">変更を公開する</button></div><div id="status"></div><div class="small">対象: perversepapillon-stack/Sapporo-night-selection / site-config.json</div></div></div><script>const OWNER='perversepapillon-stack',REPO='Sapporo-night-selection',PATH='site-config.json';let cfg,current='A';const $=id=>document.getElementById(id),fields=['name','role','imageUrl','atmosphere','budget','excitement','sapporo','quote'];async function load(){const r=await fetch('/site-config.json?ts='+Date.now(),{cache:'no-store'});cfg=await r.json();$('kicker').value=cfg.site.kicker||'';$('lead').value=cfg.site.lead||'';show('A')}function saveForm(){if(!cfg)return;cfg.site.kicker=$('kicker').value;cfg.site.lead=$('lead').value;const c=cfg.courses[current];c.enabled=$('enabled').checked;fields.forEach(f=>c[f]=$(f).value)}function show(k){if(cfg)saveForm();current=k;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.k===k));const c=cfg.courses[k];$('enabled').checked=c.enabled!==false;fields.forEach(f=>$(f).value=c[f]||'')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.k));function b64utf8(s){const u=new TextEncoder().encode(s);let bin='';u.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin)}$('publish').onclick=async()=>{saveForm();const t=$('token').value.trim(),st=$('status');if(!t){st.className='err';st.textContent='GitHub tokenを入力してください';return}st.className='';st.textContent='公開反映中…';try{const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'};const get=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{headers});if(!get.ok)throw new Error('設定ファイルの取得に失敗しました');const meta=await get.json();const put=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Update night selection config',content:b64utf8(JSON.stringify(cfg,null,2)),sha:meta.sha,branch:'main'})});if(!put.ok){const e=await put.json().catch(()=>({}));throw new Error(e.message||'更新に失敗しました')}st.className='ok';st.textContent='公開反映しました　Vercel更新後に公開画面を再読込してください'}catch(e){st.className='err';st.textContent=e.message}};load().catch(()=>{$('status').className='err';$('status').textContent='設定の読み込みに失敗しました'});</script></body></html>
