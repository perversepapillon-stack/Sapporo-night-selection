<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAPPORO NIGHT SELECTION 管理</title>
<style>
:root{--bg:#070913;--panel:#11162a;--line:#303650;--txt:#fffaf4;--muted:#aeb4c8;--gold:#f1c35b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070913,#0e1222);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}h1{margin:0 0 6px}.sub{color:var(--muted);font-size:13px}
.login,.panel{background:rgba(17,22,42,.92);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
input,select,button{font:inherit}.key{display:flex;gap:8px}.key input,.search input,.filters select{background:#0b1020;color:white;border:1px solid #39405f;border-radius:10px;padding:11px;width:100%}
button{border:1px solid #625322;background:#2a2109;color:#fff6cf;border-radius:10px;padding:10px 14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{font-size:28px;display:block;margin-top:4px}.stat small{color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{flex:1;min-width:220px}.filters{display:flex;gap:8px}.filters select{width:auto}
.tablewrap{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:860px;background:#0d1222}th,td{padding:11px;border-bottom:1px solid #252b43;text-align:left;font-size:13px}th{position:sticky;top:0;background:#151b31}td small{color:var(--muted)}.danger{background:#331317;border-color:#71333b;color:#ffd8dd}
.badge{padding:3px 8px;border-radius:999px;border:1px solid #4a516f;font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.grid .stat:first-child{grid-column:1/-1}.toolbar{align-items:stretch}.filters{width:100%}.filters select{flex:1}}
</style></head><body><main class="wrap">
<h1>SAPPORO NIGHT SELECTION</h1><div class="sub">申込管理</div>
<div class="login" id="login"><b>管理者キー</b><div class="key" style="margin-top:10px"><input id="key" type="password" placeholder="管理者キー"><button onclick="load()">開く</button></div></div>
<section id="app" hidden>
<div class="grid">
<div class="stat"><small>申込総数</small><b id="total">0</b></div>
<div class="stat"><small>Aコース</small><b id="a">0</b></div>
<div class="stat"><small>Bコース</small><b id="b">0</b></div>
<div class="stat"><small>Cコース</small><b id="c">0</b></div>
<div class="stat"><small>領収書必要</small><b id="receipts">0</b></div>
</div>
<div class="panel">
<div class="toolbar">
<div class="search"><input id="q" placeholder="氏名・所属単組・領収書宛名を検索" oninput="render()"></div>
<div class="filters"><select id="course" onchange="render()"><option value="">全コース</option><option>A</option><option>B</option><option>C</option></select><select id="receipt" onchange="render()"><option value="">領収書すべて</option><option value="yes">必要</option><option value="no">不要</option></select></div>
<button onclick="downloadCsv()">CSV出力</button><button onclick="load()">更新</button>
</div>
<div class="tablewrap"><table><thead><tr><th>申込日時</th><th>所属単組</th><th>氏名</th><th>コース</th><th>領収書</th><th>宛名</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>申込はまだありません</div></div>
</div>
</section>
</main><script>
let data=[];let adminKey="";
async function load(){adminKey=document.getElementById("key").value||sessionStorage.getItem("snsAdminKey")||"";if(!adminKey){alert("管理者キーを入力してください");return}const r=await fetch("/api/submissions",{headers:{"x-admin-key":adminKey}});if(!r.ok){alert("管理者キーが違うか、API設定が未完了です");return}sessionStorage.setItem("snsAdminKey",adminKey);data=await r.json();document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;stats();render()}
function stats(){total.textContent=data.length;a.textContent=data.filter(x=>x.course==="A").length;b.textContent=data.filter(x=>x.course==="B").length;c.textContent=data.filter(x=>x.course==="C").length;receipts.textContent=data.filter(x=>x.receiptRequired).length}
function filtered(){const s=q.value.toLowerCase().trim(),co=course.value,re=receipt.value;return data.filter(x=>(!co||x.course===co)&&(!re||(re==="yes"?x.receiptRequired:!x.receiptRequired))&&(!s||[x.organization,x.name,x.receiptName].some(v=>(v||"").toLowerCase().includes(s))))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function render(){const f=filtered();rows.innerHTML=f.map(x=>`<tr><td>${esc(new Date(x.createdAt).toLocaleString("ja-JP"))}</td><td>${esc(x.organization)}</td><td>${esc(x.name)}</td><td><span class="badge">${esc(x.course)}</span></td><td>${x.receiptRequired?"必要":"不要"}</td><td>${esc(x.receiptName||"—")}</td><td><button class="danger" onclick="removeItem('${esc(x.id)}')">削除</button></td></tr>`).join("");empty.hidden=f.length!==0}
async function removeItem(id){if(!confirm("この申込を削除しますか？"))return;const r=await fetch("/api/submissions?id="+encodeURIComponent(id),{method:"DELETE",headers:{"x-admin-key":adminKey}});if(!r.ok){alert("削除できませんでした");return}await load()}
function downloadCsv(){const f=filtered(),head=["申込日時","所属単組","氏名","コース","領収書","領収書宛名"];const lines=[head,...f.map(x=>[new Date(x.createdAt).toLocaleString("ja-JP"),x.organization,x.name,x.course,x.receiptRequired?"必要":"不要",x.receiptName||""])].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(","));const b=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sapporo-night-selection.csv";a.click();URL.revokeObjectURL(a.href)}
if(sessionStorage.getItem("snsAdminKey")){document.getElementById("key").value=sessionStorage.getItem("snsAdminKey");load()}
</script></body></html>
